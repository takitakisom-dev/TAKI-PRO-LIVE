<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E5AA7">
<title>SHOWTIME v33 SAVE GRANDE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1E5AA7;--light:#E3F0FF;--bg:#EAF2FF;--card:#fff;--border:#D6E6FF;--green:#16A34A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:Inter,Arial;padding-bottom:80px}
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--blue);color:#fff;padding:12px 16px;display:flex;justify-content:space-between}
.content{margin-top:60px;padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px}
.btn{padding:12px 16px;border-radius:22px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;cursor:pointer;width:100%}
.btn.blue{background:var(--blue);color:#fff}.btn.small{padding:6px 10px;width:auto;font-size:11px}
.file{font-size:12px;background:var(--light);color:var(--blue);padding:8px;border-radius:8px;margin:8px 0;font-weight:600}
audio{width:100%;margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;display:flex;height:70px;border-top:2px solid var(--border)}
.bottom button{flex:1;border:none;background:#fff;color:#6B8BB0;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#menu{position:fixed;inset:0;z-index:500;display:none}#menu.open{display:block}
#menuBg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#menuPanel{position:absolute;top:0;left:0;bottom:0;width:88%;max-width:380px;background:#fff;overflow-y:auto}
.menuHead{background:var(--blue);color:#fff;padding:18px;display:flex;justify-content:space-between}
.menuItem{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;align-items:center}
.menuItem .ico{width:36px;height:36px;background:var(--light);border-radius:10px;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:10px}.modal.open{display:flex}
.modalBox{background:#fff;border-radius:16px;width:100%;max-width:750px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
.modalHead{padding:14px 16px;display:flex;justify-content:space-between;color:#fff;background:var(--blue)}
.modalBody{padding:12px;overflow-y:auto}
.inp{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;margin:6px 0}
.folder{border:1px solid var(--border);border-radius:12px;margin:8px 0;overflow:hidden}
.folderHead{padding:12px 14px;background:var(--light);display:flex;justify-content:space-between;cursor:pointer;font-weight:700;color:var(--blue)}
.folderBody{display:none;padding:8px}.folderBody.open{display:block}
.songRow{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin:6px 0;background:#fff}
</style>
</head>
<body>

<div id="menu"><div id="menuBg" onclick="closeMenu()"></div><div id="menuPanel">
<div class="menuHead"><b>SHOWTIME v33 GRANDE</b><span onclick="closeMenu()" style="font-size:26px;cursor:pointer">✕</span></div>
<div class="menuItem" onclick="openMyVS()"><div class="ico">🎧</div><div><b>Meus V.S. - até 50MB</b><small id="cntVS">0 arquivos grandes</small></div></div>
<div class="menuItem" onclick="openMyPB()"><div class="ico">🎼</div><div><b>Meus PLAYBACKs - até 50MB</b><small id="cntPB">0 arquivos</small></div></div>
<div class="menuItem" onclick="openBib()"><div class="ico">📚</div><div><b>Biblioteca - Pastas</b></div></div>
<div class="menuItem" onclick="shareApp()" style="background:#E8F5E9"><div class="ico">📤</div><div><b>Compartilhar</b></div></div>
</div></div>

<div class="top"><div style="display:flex;gap:12px;align-items:center"><span style="font-size:28px;cursor:pointer" onclick="openMenu()">☰</span><b>SHOWTIME v33 - ARQUIVO GRANDE</b></div><button class="btn small" style="background:#16A34A;color:#fff;border-color:#16A34A" onclick="openMyVS()">🎧 VS</button></div>

<div class="content">
<div class="card">
<h3 style="color:var(--blue)">🎧 Player VS (Teste)</h3>
<audio id="audioVS" controls></audio>
<div class="file" id="vsLabel">Nenhum VS tocando</div>
</div>
</div>

<div class="bottom">
<button onclick="openMenu()"><span style="font-size:22px">☰</span>Menu</button>
<button onclick="openMyVS()"><span style="font-size:22px">🎧</span>Meus V.S.</button>
<button onclick="openMyPB()"><span style="font-size:22px">🎼</span>PB</button>
<button onclick="openBib()"><span style="font-size:22px">📚</span>Bib</button>
<button onclick="shareApp()"><span style="font-size:22px">📤</span>Comp</button>
</div>

<div class="modal" id="modVS"><div class="modalBox"><div class="modalHead"><b>🎧 Meus V.S. - Arquivos Grandes até 50MB</b><button class="btn small" style="background:#fff;color:var(--blue)" onclick="closeModal('modVS')">✕</button></div><div class="modalBody" id="modVSBody"></div></div></div>
<div class="modal" id="modPB"><div class="modalBox"><div class="modalHead"><b>🎼 Meus PLAYBACKs</b><button class="btn small" style="background:#fff;color:var(--blue)" onclick="closeModal('modPB')">✕</button></div><div class="modalBody" id="modPBBody"></div></div></div>
<div class="modal" id="modBib"><div class="modalBox"><div class="modalHead"><b>📚 Biblioteca</b><button class="btn small" style="background:#fff;color:var(--blue)" onclick="closeModal('modBib')">✕</button></div><div class="modalBody" id="modBibBody"></div></div></div>

<script>
// INDEXEDDB PARA ARQUIVO GRANDE
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    let req = indexedDB.open('SHOWTIME_V33', 1);
    req.onupgradeneeded = e => {
      let d = e.target.result;
      if(!d.objectStoreNames.contains('vs')) d.createObjectStore('vs', {keyPath:'id'});
      if(!d.objectStoreNames.contains('pb')) d.createObjectStore('pb', {keyPath:'id'});
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}
let vsLib = []; let pbLib = [];
async function loadAll(){
  await openDB();
  vsLib = await getAllFrom('vs');
  pbLib = await getAllFrom('pb');
  updateCount();
}
function getAllFrom(store){
  return new Promise((resolve,reject)=>{
    let tx = db.transaction(store,'readonly');
    let st = tx.objectStore(store);
    let req = st.getAll();
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject();
  });
}
function saveToStore(store, obj){
  return new Promise((resolve,reject)=>{
    let tx = db.transaction(store,'readwrite');
    let st = tx.objectStore(store);
    let req = st.put(obj);
    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject();
  });
}
function deleteFromStore(store, id){
  return new Promise((resolve,reject)=>{
    let tx = db.transaction(store,'readwrite');
    let st = tx.objectStore(store);
    let req = st.delete(id);
    req.onsuccess = ()=> resolve();
  });
}

function groupByArtist(list){const g={}; list.forEach(i=>{let art=(i.cantor||'Sem Artista').trim(); if(!g[art]) g[art]=[]; g[art].push(i);}); return g;}
function renderFolders(grouped,type){
  let html=''; Object.keys(grouped).sort().forEach(art=>{
    html+=`<div class="folder"><div class="folderHead" onclick="this.nextElementSibling.classList.toggle('open')"><span>📁 ${art}</span><span style="background:var(--blue);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px">${grouped[art].length}</span></div><div class="folderBody open">`;
    grouped[art].forEach(m=>{
      let size = m.size ? (m.size/1024/1024).toFixed(2)+' MB' : '';
      if(type==='vs') html+=`<div class="songRow"><div><b>🎧 ${m.musica}</b><br><small>${m.cantor} • ${size} • ${m.fileName}</small></div><div style="display:flex;gap:6px"><button class="btn small blue" onclick="playVS(${m.id})">▶ Tocar</button><button class="btn small" style="background:#ef4444;color:#fff;border-color:#ef4444" onclick="delVS(${m.id})">🗑️</button></div></div>`;
      else html+=`<div class="songRow"><div><b>🎼 ${m.musica}</b><br><small>${m.cantor} • ${size}</small></div><div style="display:flex;gap:6px"><button class="btn small blue" onclick="playPB(${m.id})">▶ Tocar</button><button class="btn small" style="background:#ef4444;color:#fff;border-color:#ef4444" onclick="delPB(${m.id})">🗑️</button></div></div>`;
    });
    html+=`</div></div>`;
  });
  return html||'<p style="padding:20px;text-align:center;color:#888">Nenhuma música - Seus arquivos de 10MB a 21MB vão aparecer aqui!</p>';
}

function openMenu(){document.getElementById('menu').classList.add('open');}
function closeMenu(){document.getElementById('menu').classList.remove('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function updateCount(){
  document.getElementById('cntVS').innerText = vsLib.length+' arquivos salvos - até 50MB';
  document.getElementById('cntPB').innerText = pbLib.length+' arquivos';
}

// MEUS VS COM ARQUIVO GRANDE
let tempVSFile = null;
function openMyVS(){
  let html = `
  <div style="background:#fff;border:2px solid var(--blue);border-radius:12px;padding:12px;margin-bottom:12px">
    <h3 style="color:var(--blue)">🎧 Adicionar V.S. Grande (10MB a 21MB igual seu print)</h3>
    <input type="file" id="vsInput" accept=".mp3,.wav,.m4a,.ogg" onchange="previewVS(this)" style="margin:10px 0">
    <div class="file" id="fVSLib">📁 Nenhum arquivo - pode escolher POP 01.mp3 de 10,52 MB</div>
    <input id="vsMus" class="inp" placeholder="Música: ex: POP 01 - Bateria">
    <input id="vsArt" class="inp" placeholder="Artista/Pasta: ex: POP (igual seu print)">
    <button class="btn blue" id="btnSaveVS" onclick="saveVS()">💾 SALVAR V.S. GRANDE NA PASTA</button>
    <small style="color:#666;display:block;margin-top:6px">Agora salva até 50MB usando IndexedDB, não trava mais!</small>
  </div>
  <h3 style="color:var(--blue)">📁 Meus V.S. Salvos (${vsLib.length}) - Arquivos de 10MB funcionam!</h3>
  <div id="vsFolders">${renderFolders(groupByArtist(vsLib),'vs')}</div>
  `;
  document.getElementById('modVSBody').innerHTML = html;
  document.getElementById('modVS').classList.add('open');
}
function previewVS(input){
  let f = input.files[0]; if(!f) return;
  tempVSFile = f;
  document.getElementById('fVSLib').innerText = `✅ ${f.name} - ${(f.size/1024/1024).toFixed(2)} MB - Pronto pra salvar!`;
  document.getElementById('vsMus').value = f.name.replace('.mp3','');
}
async function saveVS(){
  let m = document.getElementById('vsMus').value.trim();
  let a = document.getElementById('vsArt').value.trim() || 'POP';
  if(!tempVSFile){ alert('Escolha o arquivo primeiro! Igual seu print POP 01.mp3'); return; }
  if(!m){ alert('Digite nome da música'); return; }
  
  let btn = document.getElementById('btnSaveVS');
  btn.disabled = true; btn.innerText = '⏳ Salvando '+ (tempVSFile.size/1024/1024).toFixed(1) +'MB... aguarde!';
  
  try {
    await openDB();
    let obj = {
      id: Date.now(),
      musica: m,
      cantor: a,
      fileName: tempVSFile.name,
      size: tempVSFile.size,
      blob: tempVSFile, // Salva o arquivo inteiro como blob!
      created: new Date().toISOString()
    };
    await saveToStore('vs', obj);
    vsLib = await getAllFrom('vs');
    tempVSFile = null;
    alert('✅ SALVO! '+m+' ('+(obj.size/1024/1024).toFixed(2)+'MB) na pasta: '+a+'\n\nAgora pode salvar POP 02 de 12,47MB também!');
    openMyVS();
    updateCount();
  } catch(e){
    alert('Erro ao salvar: '+e.message+'\nTente arquivo menor ou limpe espaço do navegador');
    btn.disabled = false; btn.innerText = '💾 SALVAR V.S. GRANDE NA PASTA';
  }
}
async function playVS(id){
  let item = vsLib.find(x=>x.id===id);
  if(!item) return;
  let audio = document.getElementById('audioVS');
  // Cria URL do blob
  let url = URL.createObjectURL(item.blob);
  audio.src = url;
  document.getElementById('vsLabel').innerText = '🎧 Tocando: '+item.musica+' - '+item.cantor+' ('+(item.size/1024/1024).toFixed(2)+'MB)';
  audio.play();
  closeModal('modVS');
  openMenu(); // abre menu pra ver tocando
}
async function delVS(id){
  if(!confirm('Apagar esse V.S. grande?')) return;
  await deleteFromStore('vs', id);
  vsLib = await getAllFrom('vs');
  openMyVS();
  updateCount();
}

// PB IGUAL
let tempPBFile = null;
function openMyPB(){
  let html = `
  <div style="background:#fff;border:2px solid var(--blue);border-radius:12px;padding:12px;margin-bottom:12px">
    <h3 style="color:var(--blue)">🎼 Adicionar Playback Grande</h3>
    <input type="file" id="pbInput" accept=".mp3,.wav,.m4a,.ogg" onchange="previewPB(this)" style="margin:10px 0">
    <div class="file" id="fPBLib">📁 Nenhum arquivo</div>
    <input id="pbMus" class="inp" placeholder="Música">
    <input id="pbArt" class="inp" placeholder="Artista/Pasta">
    <button class="btn blue" id="btnSavePB" onclick="savePB()">💾 SALVAR PLAYBACK GRANDE</button>
  </div>
  <h3>📁 Meus Playbacks (${pbLib.length})</h3>
  <div>${renderFolders(groupByArtist(pbLib),'pb')}</div>
  `;
  document.getElementById('modPBBody').innerHTML = html;
  document.getElementById('modPB').classList.add('open');
}
function previewPB(input){ let f=input.files[0]; if(!f) return; tempPBFile=f; document.getElementById('fPBLib').innerText=`✅ ${f.name} - ${(f.size/1024/1024).toFixed(2)} MB`; document.getElementById('pbMus').value=f.name.replace('.mp3',''); }
async function savePB(){
  let m=document.getElementById('pbMus').value.trim(); let a=document.getElementById('pbArt').value.trim()||'Sem Artista';
  if(!tempPBFile){ alert('Escolha arquivo'); return; }
  let btn=document.getElementById('btnSavePB'); btn.disabled=true; btn.innerText='⏳ Salvando...';
  await openDB();
  let obj={id:Date.now(), musica:m, cantor:a, fileName:tempPBFile.name, size:tempPBFile.size, blob:tempPBFile, created:new Date().toISOString()};
  await saveToStore('pb', obj);
  pbLib = await getAllFrom('pb');
  alert('✅ Playback salvo: '+m); openMyPB(); updateCount();
}
async function playPB(id){
  let item=pbLib.find(x=>x.id===id); if(!item) return;
  let audio=document.getElementById('audioVS'); let url=URL.createObjectURL(item.blob); audio.src=url; document.getElementById('vsLabel').innerText='🎼 Playback: '+item.musica; audio.play(); closeModal('modPB');
}
async function delPB(id){ if(!confirm('Apagar?')) return; await deleteFromStore('pb', id); pbLib=await getAllFrom('pb'); openMyPB(); updateCount(); }

function openBib(){
  let vsG=groupByArtist(vsLib), pbG=groupByArtist(pbLib);
  let html=`<h2 style="text-align:center;color:var(--blue)">📚 Biblioteca - Arquivos Grandes</h2>
  <p style="text-align:center;color:#666">Seus POP de 10MB a 21MB agora salvos aqui!</p>
  <div class="folder"><div class="folderHead" onclick="this.nextElementSibling.classList.toggle('open')"><span>📁 Pasta V.S. (${vsLib.length}) - 10MB a 21MB OK</span></div><div class="folderBody open">${renderFolders(vsG,'vs')}</div></div>
  <div class="folder"><div class="folderHead" onclick="this.nextElementSibling.classList.toggle('open')"><span>📁 Pasta PB (${pbLib.length})</span></div><div class="folderBody open">${renderFolders(pbG,'pb')}</div></div>`;
  document.getElementById('modBibBody').innerHTML=html; document.getElementById('modBib').classList.add('open');
}
function shareApp(){ alert('Compartilhar: '+location.href+'?pedeai=1'); }

// Inicializa
openDB().then(()=>{ loadAll(); });

</script>
</body>
</html>
