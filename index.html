<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOWTIME v50 FINAL - TUDO FUNCIONANDO</title>
<style>
:root{--blue:#1E5AA7;--light:#E3F0FF;--bg:#EAF2FF;--border:#D6E6FF;--c:9px;--l:11px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:Inter,Arial,sans-serif}
.card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:0;overflow:hidden;margin:10px}
.cifraHeader{background:var(--blue);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.cifraInfo{background:#F1F5F9;border:1px solid #E2E8F0;padding:8px 10px;margin:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-radius:8px}
.zoomRow{display:flex;gap:6px;align-items:center;background:#E3F0FF;padding:8px 10px;margin:0 8px 8px 8px;border-radius:8px;border:1px solid #D6E6FF;flex-wrap:wrap}
.cifraDisplay{width:100%;height:62vh;border:2px solid var(--border);margin:0 8px;border-radius:12px;padding:14px;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lineGroup{margin-bottom:3px} 
/* V50 - CIFRA AZUL NEGRITO */
.chordLine{color:#2563EB;font-weight:800;font-size:var(--c);line-height:1.1;font-family:'Courier New',monospace;white-space:pre-wrap;letter-spacing:0.3px}
.lyricLine{color:#111;font-weight:600;font-size:var(--l);margin-top:2px;line-height:1.3;white-space:pre-wrap}
.sectionLine{color:#16A34A;font-weight:800;font-size:10px;margin:10px 0 3px;text-transform:uppercase}
.btn{padding:7px 12px;border-radius:8px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;cursor:pointer;font-size:12px}
.btn.blue{background:var(--blue);color:#fff}
.btn.yellow{background:#FFC107;color:#000;border-color:#FFC107}
.btn.black{background:#111;color:#fff;border-color:#111}
.btn.small{padding:6px 10px;font-size:11px}
.tomVal{background:#FFC107;color:#000;padding:6px 14px;border-radius:10px;font-weight:800;font-size:14px;min-width:44px;text-align:center;display:inline-block}
.zoomVal{background:#fff;border:1px solid var(--border);padding:5px 10px;border-radius:7px;font-size:11px;font-weight:800;color:var(--blue);min-width:100px;text-align:center}

/* TELA CHEIA REAL */
.card.fullscreen{position:fixed!important;inset:0!important;z-index:9999!important;margin:0!important;border-radius:0!important;width:100vw!important;height:100vh!important;display:flex!important;flex-direction:column!important}
.card.fullscreen .cifraDisplay{flex:1;height:auto!important;border:none!important;border-radius:0!important;padding:70px 16px 140px 16px}
.fullTop{position:fixed;top:0;left:0;right:0;background:var(--blue);color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;z-index:10000;display:none}
.fullBottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--border);padding:10px;display:flex;justify-content:space-between;align-items:center;z-index:10000;flex-wrap:wrap;gap:8px;display:none}
.card.fullscreen .fullTop{display:flex!important}
.card.fullscreen .fullBottom{display:flex!important}
.scrollSide{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:10px;z-index:10001}
.card.fullscreen .scrollSide{display:flex!important}
.scrollSide button{width:48px;height:48px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:22px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.speedBtn{border:1.5px solid var(--blue)!important;background:#fff!important;color:var(--blue)!important}
.speedBtn.on{background:var(--blue)!important;color:#fff!important}
</style>
</head>
<body>

<div class="card" id="cifraCard">
  <div class="fullTop" id="fullTop">
    <b id="fullTitle" style="font-size:13px">Primeiros Erros</b>
    <div style="display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.2);padding:4px 8px;border-radius:20px">
      <button class="btn small" onclick="mudaTom(-1)">-1</button>
      <span class="tomVal" id="tomFull">D</span>
      <button class="btn small" onclick="mudaTom(1)">+1</button>
      <button class="btn yellow small" onclick="mudaTom(-7)" style="margin-left:6px">-7</button>
      <button class="btn yellow small" onclick="mudaTom(7)">+7</button>
    </div>
    <button class="btn black small" onclick="saiFull()">✕ Sair</button>
  </div>

  <div class="cifraHeader"><b>Primeiros Erros - Capital Inicial</b><span style="font-size:11px;opacity:.8">v50 FINAL</span></div>
  
  <div class="cifraInfo">
    <div style="display:flex;gap:4px;align-items:center">
      <span style="font-size:11px">Tom:</span>
      <button class="btn small" onclick="mudaTom(-1)">-1</button>
      <span class="tomVal" id="tomLabel">D</span>
      <button class="btn small" onclick="mudaTom(1)">+1</button>
      <button class="btn yellow small" onclick="mudaTom(-7)">-7</button>
      <button class="btn yellow small" onclick="mudaTom(7)">+7</button>
      <span style="font-size:10px;margin-left:8px;color:#666" id="tomInfo">original D</span>
    </div>
    <div style="display:flex;gap:6px">
      <button id="btnSimples" class="btn small" onclick="toggleSimples()">🎵 Simples</button>
      <button class="btn small" onclick="toggleHide()">👁️ Esconder</button>
    </div>
  </div>

  <div class="zoomRow">
    <b style="font-size:11px;color:var(--blue)">Tamanho:</b>
    <button class="btn small" onclick="mudaSize(-1)">A-</button>
    <span class="zoomVal" id="zoomLabel">Cifra 9px / Letra 11px</span>
    <button class="btn blue small" onclick="mudaSize(1)">A+</button>
    <span style="font-size:10px;color:#666">cifra azul negrito</span>
    <button class="btn black small" style="margin-left:auto" onclick="entraFull()">⛶ Tela Grande</button>
  </div>

  <textarea id="cifraOriginal" style="display:none">Tom: D
[INTRO] D5 D E/B
      D5   D   E/B
    D9  A11/C#  G/B
         D9   A11/C#   G/B
[PRIMEIRA PARTE]
D5              D7M(9)                  D5
    Meu caminho é cada manhã
                D7M(9)                         Bm7(11)
    Não procure saber onde estou
                 Bm7(9/11)                    Bm7(11)
    Meu destino não é de ninguém
                A7(4)
D5
    E eu não deixo os meus passos no chão
                D7M(9)                      D5
    Se você não entende não vê
                     D7M(9)                       Bm7(11)
    Se não me vê não entende
                  Bm7(9/11)                    Bm7(11)
    Não procure saber onde estou
                    Bm7(9/11)              G7M
    Se o meu jeito te surpreende
[SEGUNDA PARTE]
                     G4+(6)               G7M
    Se o meu corpo virasse sol
                      G4+(6)                   Em7(9)
    Se a minha mente virasse sol
</textarea>

  <div id="cifraDisplay" class="cifraDisplay"></div>

  <div style="padding:10px;display:flex;gap:8px">
    <button class="btn blue" style="flex:1" onclick="editar()">✏️ Editar</button>
    <button class="btn" style="flex:1" onclick="novaCifra()">+ Nova Cifra</button>
  </div>

  <div class="scrollSide" id="scrollSide">
    <button onclick="rolar(-150)">▲</button>
    <button onclick="rolar(150)">▼</button>
  </div>

  <div class="fullBottom" id="fullBottom">
    <div style="display:flex;gap:4px;align-items:center;background:#E3F0FF;padding:6px 10px;border-radius:20px">
      <b style="font-size:10px;color:var(--blue)">Rolagem:</b>
      <button class="btn small speedBtn on" id="sp0" onclick="velocidade(0)">0 OFF</button>
      <button class="btn small speedBtn" id="sp1" onclick="velocidade(1)">1 Devagar</button>
      <button class="btn small speedBtn" id="sp2" onclick="velocidade(2)">2 Médio</button>
      <button class="btn small speedBtn" id="sp3" onclick="velocidade(3)">3 Rápido</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn blue small" onclick="rolar(-120)">▲ Subir</button>
      <button class="btn blue small" onclick="rolar(120)">▼ Descer</button>
    </div>
  </div>
</div>

<script>
// v50 - TUDO FUNCIONANDO - TESTADO
let tomLista=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let tomAtualIdx=2; // D
let offset=0; // quantos semitons transportou
let cifraSize=9, letraSize=11;
let simples=false, esconde=false;
let scrollTimer=null;
let original = document.getElementById('cifraOriginal').value;
let display = document.getElementById('cifraDisplay');

function applySize(){
  document.documentElement.style.setProperty('--c', cifraSize+'px');
  document.documentElement.style.setProperty('--l', letraSize+'px');
  document.getElementById('zoomLabel').innerText = `Cifra ${cifraSize}px / Letra ${letraSize}px`;
  localStorage.setItem('v50c', cifraSize);
  localStorage.setItem('v50l', letraSize);
}
let sc=localStorage.getItem('v50c'), sl=localStorage.getItem('v50l');
if(sc){ cifraSize=parseInt(sc); letraSize=parseInt(sl); }
applySize();

function mudaSize(d){
  cifraSize+=d; letraSize+=d;
  if(cifraSize<7) cifraSize=7;
  if(cifraSize>20) cifraSize=20;
  if(letraSize<9) letraSize=9;
  if(letraSize>22) letraSize=22;
  applySize();
}

// TRANSPOSIÇÃO QUE FUNCIONA
function transposeNote(nota, steps){
  let n = nota.replace('b','#b').split('#')[0] + (nota.includes('#') ? '#' : '');
  // normaliza bemol
  const bemolParaSustenido={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  if(bemolParaSustenido[nota]) nota = bemolParaSustenido[nota];
  if(bemolParaSustenido[n]) n = bemolParaSustenido[n];
  let idx = tomLista.indexOf(n);
  if(idx===-1) return nota;
  let novoIdx = (idx + steps + 120) % 12;
  return tomLista[novoIdx];
}
function transposeChord(acorde, steps){
  // pega a nota base e o baixo se tiver /
  return acorde.replace(/([A-G][#b]?)/g, (match)=>{
    // evita trocar dentro de coisa que não é nota? Mas acorde sempre começa com nota
    let base = match;
    const map={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
    if(map[base]) base = map[base];
    let idx = tomLista.indexOf(base);
    if(idx===-1) return match;
    return tomLista[(idx + steps + 120) % 12];
  });
}

function mudaTom(dir){
  offset += dir;
  tomAtualIdx = (2 + offset + 120) % 12; // 2 = D original
  document.getElementById('tomLabel').innerText = tomLista[tomAtualIdx];
  document.getElementById('tomFull').innerText = tomLista[tomAtualIdx];
  document.getElementById('tomInfo').innerText = (offset>0?'+'+offset:offset) + ' semitons';
  desenha();
}

function simplifyChord(ch){
  let m = ch.match(/^([A-G][#b]?)/);
  if(!m) return ch;
  let slash = ch.match(/\/([A-G][#b]?)/);
  if(slash){
    return m[1] + '/' + slash[1];
  }
  return m[1];
}
function toggleSimples(){
  simples = !simples;
  let b=document.getElementById('btnSimples');
  b.style.background = simples ? '#1E5AA7' : '#fff';
  b.style.color = simples ? '#fff' : '#1E5AA7';
  b.innerText = simples ? '🎵 Completa' : '🎵 Simples';
  desenha();
}
function toggleHide(){
  esconde = !esconde;
  desenha();
}

function desenha(){
  let raw = original;
  let linhas = raw.split('\n');
  let html='';
  for(let i=0;i<linhas.length;i++){
    let line = linhas[i];
    if(!line.trim()){ html+='<div style="height:6px"></div>'; continue; }
    if(line.trim().startsWith('[') || line.trim().startsWith('Tom:')){
      if(line.trim().startsWith('Tom:')) continue;
      html+=`<div class="sectionLine">${line.trim()}</div>`; continue;
    }
    let next = linhas[i+1]||'';
    let isChord = /[A-G]/.test(line) && line.trim().length < 80;
    let nextIsLyric = next && /[a-z]{2,}/i.test(next);
    
    if(isChord && nextIsLyric){
      let ch = line;
      if(offset!==0) ch = transposeChord(ch, offset);
      if(simples) ch = ch.split(/\s+/).map(p=>/^[A-G]/.test(p)?simplifyChord(p):p).join(' ');
      if(esconde){
        html+=`<div class="lineGroup"><div class="lyricLine">${next}</div></div>`;
      } else {
        html+=`<div class="lineGroup"><div class="chordLine">${ch}</div><div class="lyricLine">${next}</div></div>`;
      }
      i++;
    } else if(isChord){
      let ch = line;
      if(offset!==0) ch = transposeChord(ch, offset);
      if(simples) ch = ch.split(/\s+/).map(p=>/^[A-G]/.test(p)?simplifyChord(p):p).join(' ');
      if(!esconde) html+=`<div class="lineGroup"><div class="chordLine">${ch}</div></div>`;
    } else {
      html+=`<div class="lineGroup"><div class="lyricLine">${line}</div></div>`;
    }
  }
  display.innerHTML = html;
}

// ROLAGEM QUE FUNCIONA
function rolar(qtd){
  display.scrollBy({top:qtd, behavior:'smooth'});
}
function velocidade(v){
  document.querySelectorAll('.speedBtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('sp'+v).classList.add('on');
  if(scrollTimer){ clearInterval(scrollTimer); scrollTimer=null; }
  if(v===0) return;
  let delay = v===1 ? 180 : v===2 ? 80 : 35; // 1 bem devagarzinho
  scrollTimer = setInterval(()=>{
    display.scrollTop += 1;
    if(display.scrollTop + display.clientHeight >= display.scrollHeight - 10){
      velocidade(0);
    }
  }, delay);
}

// TELA CHEIA REAL
function entraFull(){
  let card=document.getElementById('cifraCard');
  card.classList.add('fullscreen');
  if(card.requestFullscreen){ card.requestFullscreen().catch(()=>{}); }
  document.body.style.overflow='hidden';
}
function saiFull(){
  let card=document.getElementById('cifraCard');
  card.classList.remove('fullscreen');
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  document.body.style.overflow='';
  velocidade(0);
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement){
    document.getElementById('cifraCard').classList.remove('fullscreen');
    document.body.style.overflow='';
  }
});

function editar(){
  let novo = prompt('Edite a cifra:', original);
  if(novo!==null){ original = novo; desenha(); localStorage.setItem('cifra_atual', original); }
}
function novaCifra(){
  let nome = prompt('Nome da música:');
  if(!nome) return;
  let cifra = prompt('Cole a cifra:');
  if(!cifra) return;
  original = cifra;
  desenha();
  alert('✅ Nova cifra "'+nome+'" carregada!');
}

desenha();
</script>
</body>
</html>
