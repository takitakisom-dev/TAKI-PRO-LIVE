<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:#fff;padding:10px 14px;border-radius:10px;margin:-12px -12px 12px -12px">
    <div>
      <input id="cifraMusica" value="Será - Legião Urbana" style="background:transparent;border:none;color:#fff;font-weight:800;font-size:15px;width:200px">
      <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
        <span style="font-size:12px">Tom:</span>
        <button class="btn small" style="background:#fff;color:var(--blue);padding:4px 10px" onclick="changeTom(-1)">-1</button>
        <b id="tomAtual" style="background:#fff;color:var(--blue);padding:4px 12px;border-radius:20px;font-size:13px">D</b>
        <button class="btn small" style="background:#fff;color:var(--blue);padding:4px 10px" onclick="changeTom(1)">+1</button>
        <button class="btn small" style="background:#E3F0FF;color:var(--blue);padding:4px 10px" onclick="toggleSimplificada()" id="btnSimp">Simplificar</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="btn small" style="background:#fff;color:var(--blue)" onclick="openMenu()">☰</button>
      <button class="btn small" style="background:#16A34A;color:#fff;border-color:#16A34A" onclick="toggleScroll()" id="btnScroll">▶ Rolagem</button>
    </div>
  </div>

  <!-- Controles de rolagem -->
  <div style="display:flex;gap:8px;align-items:center;background:var(--light);padding:8px 12px;border-radius:10px;margin-bottom:10px">
    <span style="font-size:11px;font-weight:800;color:var(--blue)">Rolagem:</span>
    <input type="range" id="velScroll" min="0" max="10" value="0" oninput="setVelScroll(this.value)" style="flex:1;accent-color:var(--blue)">
    <b id="velLabel" style="font-size:11px;color:var(--blue)">0 - Parado</b>
    <button class="btn small" style="background:var(--blue);color:#fff" onclick="toggleScroll()" id="btnPlayScroll">▶</button>
  </div>

  <!-- Área de edição da cifra -->
  <textarea id="cifraTexto" style="width:100%;height:260px;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:monospace;font-weight:600;font-size:14px;white-space:pre;overflow-y:auto" 
oninput="saveCifraAuto()">[Intro] D  A/C#  Bm  G
D               A/C#
Será que eu sou o único...
Bm              G
Que não tem nada pra fazer...
  </textarea>

  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn blue" onclick="shareApp()">📤 Compartilhar Cifra</button>
    <button class="btn" onclick="openRep()">💾 Salvar na pasta</button>
    <button class="btn green" onclick="adicionarNovaCifra()">+ Nova Cifra</button>
  </div>
</div>

<script>
let tomList = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let tomIndex = 2; // D
let scrollInterval = null;
let simplificada = false;

function changeTom(dir){
  tomIndex = (tomIndex + dir + 12) % 12;
  document.getElementById('tomAtual').innerText = tomList[tomIndex];
  // Aqui faz a transposição da cifra no textarea (simplificado)
  alert('Tom mudado para: '+tomList[tomIndex]+' - Na v36 final transpoe automatico a cifra toda!');
  saveCifraAuto();
}

function toggleSimplificada(){
  simplificada = !simplificada;
  document.getElementById('btnSimp').innerText = simplificada ? 'Original' : 'Simplificar';
  document.getElementById('btnSimp').style.background = simplificada ? '#16A34A' : '#E3F0FF';
  document.getElementById('btnSimp').style.color = simplificada ? '#fff' : 'var(--blue)';
  // Aqui remove 7, 9, 13, etc
  if(simplificada){
    alert('Modo simplificado: D7M(9) vira D - Vou implementar na v36 final!');
  }
}

function setVelScroll(v){
  document.getElementById('velLabel').innerText = v==0 ? '0 - Parado' : v+' - Velocidade';
  if(scrollInterval){ clearInterval(scrollInterval); scrollInterval=null; }
  if(v>0){ startScroll(v); }
}

function toggleScroll(){
  let vel = document.getElementById('velScroll').value;
  if(scrollInterval){
    clearInterval(scrollInterval); scrollInterval=null;
    document.getElementById('btnScroll').innerText='▶ Rolagem';
    document.getElementById('btnPlayScroll').innerText='▶';
    document.getElementById('velScroll').value=0;
    document.getElementById('velLabel').innerText='0 - Parado';
  } else {
    if(vel==0) document.getElementById('velScroll').value=3;
    startScroll(document.getElementById('velScroll').value);
    document.getElementById('btnScroll').innerText='⏸ Parar';
    document.getElementById('btnPlayScroll').innerText='⏸';
  }
}

function startScroll(vel){
  let ta = document.getElementById('cifraTexto');
  if(scrollInterval) clearInterval(scrollInterval);
  let speed = 11 - vel; // 10 = lento, 1 = rapido
  scrollInterval = setInterval(()=>{
    ta.scrollTop += 1;
    if(ta.scrollTop + ta.clientHeight >= ta.scrollHeight){
      clearInterval(scrollInterval); scrollInterval=null;
      document.getElementById('btnScroll').innerText='▶ Rolagem';
      document.getElementById('btnPlayScroll').innerText='▶';
    }
  }, speed*50);
}

function saveCifraAuto(){
  localStorage.setItem('cifra_atual', document.getElementById('cifraTexto').value);
}

function adicionarNovaCifra(){
  let nome = prompt('Nome da nova cifra? Ex: Garota de Ipanema - Tom Jobim');
  if(!nome) return;
  document.getElementById('cifraMusica').value = nome;
  document.getElementById('cifraTexto').value = '[Intro]\n\n[Verso]\nDigite sua cifra aqui...\n\n[Refrão]\n';
  tomIndex = 0; document.getElementById('tomAtual').innerText='C';
  alert('✅ Nova cifra criada! Agora é só colar a cifra e salvar na pasta');
}
</script>
