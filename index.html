<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHOWTIME v4.7 PLAY FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} html,body{overflow-x:hidden!important;width:100%}
:root{--bg:#0A0A0A;--card:#161616;--card2:#1E1E1E;--gold:#D4B483;--orange:#B45309;--white:#FAFAFA;--gray:#6B6B6B;--border:#232323;--chord-size:15px;--lyric-size:17px}
body{background:var(--bg);color:var(--white);font-family:Inter,system-ui}
aside{width:240px;background:var(--card);border-right:1px solid var(--border);padding:20px 0;position:fixed;height:100vh;z-index:100;transition:.3s}
main{margin-left:240px;padding:12px;display:grid;grid-template-columns:1fr 1fr 420px;gap:12px}
.topbar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);padding:12px 16px;border-radius:12px}
.hamburger{display:none;font-size:22px;background:none;border:none;color:var(--gold);cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;width:100%;overflow:hidden}
.btn{padding:8px 14px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer}
.btn.gold{background:var(--gold);color:#000}
.btn.big{width:100%;padding:12px;font-size:13px;margin-bottom:8px;display:flex;justify-content:center;gap:8px}
.file{font-size:11px;color:var(--gray);background:#111;padding:8px 10px;border-radius:8px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px}
.ctrl label{font-size:9px;color:var(--gray);display:flex;justify-content:space-between;margin-bottom:6px}
.ctrl input{width:100%;accent-color:var(--gold);height:4px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.cifra-top{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.cifra-title{font-size:18px;font-weight:900}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;background:#111;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper .val{min-width:40px;text-align:center;font-weight:800}
.stepper .val.gold{background:var(--gold);color:#000;padding:4px 10px;border-radius:20px;font-size:12px}
.cifra-box{background:#0E0E0E;border:1px solid var(--border);border-radius:12px;padding:20px;height:420px;overflow-y:auto;scroll-behavior:smooth}
.cifra-line{display:block;margin-bottom:12px;line-height:1.1}
.pair{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:bottom;margin-right:5px}
.chord{color:var(--orange);font-weight:800;font-size:var(--chord-size);line-height:1;margin:0 0 1px 0}
.lyric{color:#E8E8E8;font-size:var(--lyric-size);line-height:1.3;white-space:pre-wrap;margin:0}
.collapsible.open{max-height:900px;overflow:hidden;transition:.35s}
.collapsible.closed{max-height:0;overflow:hidden;transition:.35s}
.arrow{cursor:pointer;color:var(--gold)}
.scroll-bar{display:flex;align-items:center;gap:8px;background:#111;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-top:8px;flex-wrap:wrap}
.speed{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--gray);cursor:pointer;font-weight:700}
.speed.active{background:var(--gold);color:#000;border-color:var(--gold)}
audio{width:100%;height:38px;margin-bottom:8px;border-radius:8px}
body.fullscreen-cifra aside,body.fullscreen-cifra .topbar,body.fullscreen-cifra .player-card{display:none!important}
body.fullscreen-cifra main{margin:0;padding:0;display:block;height:100vh;background:#FFFBF0}
body.fullscreen-cifra .cifra-card{height:100vh;border:none;border-radius:0;background:#FFFBF0;padding:0;display:flex;flex-direction:column}
body.fullscreen-cifra .cifra-top{padding:12px 16px;background:#FFFBF0;border-bottom:1px solid #EDE3D0;display:flex!important}
body.fullscreen-cifra .cifra-title{color:#2B2B2B}
body.fullscreen-cifra .cifra-box{flex:1;border:none;background:#FFFBF0;height:auto;padding:24px 18px}
body.fullscreen-cifra .chord{color:#B45309!important;font-size:calc(var(--chord-size) * 1.05)!important;margin-bottom:1px!important}
body.fullscreen-cifra .lyric{color:#2E2E2E!important;font-size:calc(var(--lyric-size) * 1.08)!important;line-height:1.35!important;font-weight:500}
body.fullscreen-cifra .cifra-line{margin-bottom:16px!important}
.float-tools{position:fixed;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,251,240,.96);border:1px solid #D4B483;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:.25s}
.float-tools.show{opacity:1;pointer-events:auto}
.float-tools button{width:44px;height:44px;border-radius:50%;border:1px solid #D4B483;background:#fff;color:#8B6A3E;font-size:18px;cursor:pointer}
.float-tools .label{font-size:9px;color:#8B6A3E;text-align:center;font-weight:700}
.hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:6px 14px;border-radius:20px;font-size:10px;z-index:60;display:none}
.hint.show{display:block}
@media(max-width:900px){aside{transform:translateX(-100%)} aside.open{transform:translateX(0)} main{margin-left:0;grid-template-columns:1fr!important;gap:10px;padding:10px;width:100vw} .hamburger{display:block} .overlay.open{display:block} .cifra-box{height:380px}}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<aside id="sidebar"><div style="padding:0 20px 20px;color:var(--gold);font-weight:900;letter-spacing:2px;border-bottom:1px solid var(--border)">SHOWTIME PRO</div></aside>
<main>
<div class="topbar"><button class="hamburger" onclick="toggleMenu()">☰</button><div><b style="color:var(--gold)">PALCO AO VIVO</b></div><div>🔔</div></div>

<div class="card player-card">
<button class="btn big gold" onclick="document.getElementById('fVS').click()">🔍 Buscar VS</button>
<input type="file" id="fVS" hidden accept=".mp3,.wav,.m4a" onchange="loadVS(this)">
<div class="file" id="fVSName">📁 Nenhum VS</div>
<audio id="aVS" controls playsinline preload="metadata"></audio>
<div class="controls">
<div class="ctrl"><label><span>BPM</span><b id="vsB">100%</b></label><input type="range" min="50" max="200" value="100" oninput="changeBPM('vs',this.value)"></div>
<div class="ctrl"><label><span>VOLUME</span><b id="vsV">80%</b></label><input type="range" min="0" max="100" value="80" oninput="changeVol('vs',this.value)"></div>
<div class="ctrl"><label><span>GRAVES</span><b id="vsG">0dB</b></label><input type="range" min="-15" max="15" value="0" oninput="changeEQ('vs','bass',this.value)"></div>
<div class="ctrl"><label><span>AGUDOS</span><b id="vsA">0dB</b></label><input type="range" min="-15" max="15" value="0" oninput="changeEQ('vs','treble',this.value)"></div>
<div class="ctrl"><label><span>REVERB</span><b id="vsR">0%</b></label><input type="range" min="0" max="100" value="0" oninput="vsR.innerText=this.value+'%'"></div>
<div class="ctrl"><label><span>PITCH</span><b id="vsP">0</b></label><input type="range" min="-12" max="12" value="0" oninput="vsP.innerText=this.value"></div>
</div>
</div>

<div class="card player-card">
<button class="btn big" onclick="document.getElementById('fPB').click()">🔍 Buscar Playback</button>
<input type="file" id="fPB" hidden accept=".mp3,.wav,.m4a" onchange="loadPB(this)">
<div class="file" id="fPBName">📁 Nenhum Playback</div>
<audio id="aPB" controls playsinline preload="metadata"></audio>
<div class="controls">
<div class="ctrl"><label><span>BPM</span><b id="pbB">100%</b></label><input type="range" min="50" max="200" value="100" oninput="changeBPM('pb',this.value)"></div>
<div class="ctrl"><label><span>VOLUME</span><b id="pbV">80%</b></label><input type="range" min="0" max="100" value="80" oninput="changeVol('pb',this.value)"></div>
<div class="ctrl"><label><span>GRAVES</span><b id="pbG">0dB</b></label><input type="range" min="-15" max="15" value="0" oninput="changeEQ('pb','bass',this.value)"></div>
<div class="ctrl"><label><span>AGUDOS</span><b id="pbA">0dB</b></label><input type="range" min="-15" max="15" value="0" oninput="changeEQ('pb','treble',this.value)"></div>
<div class="ctrl"><label><span>REVERB</span><b id="pbR">0%</b></label><input type="range" min="0" max="100" value="0" oninput="pbR.innerText=this.value+'%'"></div>
<div class="ctrl"><label><span>PITCH</span><b id="pbP">0</b></label><input type="range" min="-12" max="12" value="0" oninput="pbP.innerText=this.value"></div>
</div>
</div>

<div class="card cifra-card">
<div class="cifra-top">
<div class="cifra-title">Cifra</div>
<button class="btn small gold" onclick="document.getElementById('fCifra').click()">+ Nova Cifra</button>
<button class="btn small" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
<input type="file" id="fCifra" hidden accept=".txt" onchange="loadCifra(this)">
<div style="margin-left:auto;display:flex;gap:8px;align-items:center"><span style="font-size:11px;color:var(--gray)">Controles</span><span class="arrow" id="arrow" onclick="toggleControles()">▼</span></div>
</div>
<div class="collapsible open" id="controles">
<div class="ctrl-row"><span class="label">Tom</span><div class="stepper"><button onclick="chgTom(-1)">−</button><span class="val gold" id="tom">G</span><button onclick="chgTom(1)">+</button></div></div>
<div class="ctrl-row"><span class="label">Capo</span><div class="stepper"><button onclick="chgCapo(-1)">−</button><span class="val" id="capo">0</span><button onclick="chgCapo(1)">+</button></div></div>
<div class="ctrl-row"><span class="label">Acorde</span><div class="stepper"><button onclick="chgSz('c',-1)">−</button><span class="val" id="cSz">15px</span><button onclick="chgSz('c',1)">+</button></div></div>
<div class="ctrl-row"><span class="label">Letra</span><div class="stepper"><button onclick="chgSz('l',-1)">−</button><span class="val" id="lSz">17px</span><button onclick="chgSz('l',1)">+</button></div></div>
<div class="scroll-bar">
<span style="font-size:10px;color:var(--gold);font-weight:800">AUTO-SCROLL</span>
<div style="display:flex;gap:6px"><button class="speed active" id="sp1" onclick="setSpeed(1)">1</button><button class="speed" id="sp2" onclick="setSpeed(2)">2</button><button class="speed" id="sp3" onclick="setSpeed(3)">3</button><button class="speed" id="sp4" onclick="setSpeed(4)">4</button></div>
<span style="font-size:9px;color:var(--gray)" id="speedLabel">muito lento</span>
<button class="btn small gold" id="playScroll" onclick="toggleScroll()" style="margin-left:auto">▶ PLAY</button>
</div>
</div>
<div class="cifra-box" id="cifraBox" onclick="handleTap()"></div>
</div>
</main>

<div class="float-tools" id="floatTools">
<button onclick="chgSz('l',-1)">−</button><div class="label">LETRA</div><button onclick="chgSz('l',1)">+</button>
<div style="height:1px;background:#EDE3D0;margin:4px 0"></div>
<button onclick="chgSz('c',-1)" style="font-size:11px">C-</button><div class="label">ACORDE</div><button onclick="chgSz('c',1)" style="font-size:11px">C+</button>
<button onclick="hideTools()" style="margin-top:8px;background:#2B2B2B;color:#fff">✕</button>
</div>
<div class="hint" id="hint">Toque na letra para mostrar controles</div>

<script>
let cs=15,ls=17,scrollId=null,speed=1,isScrolling=false,toolsVisible=false;
const speeds=[0,0.25,0.7,1.6,3.0]; const labels=['','muito lento','lento','medio','rapido'];
let originalCifra="[G]Como e grande o meu amor por voce,\n[C]Meu coracao e tao pequeno,\n[G]So agora e que eu vi,\n[D]Que esse amor por voce e demais,\n[Em]Como e grande o meu amor por voce\n[G]Nem mesmo o ceu nem as estrelas,\n[C]Nem mesmo o mar e o infinito,\n[D]Nada e maior que o meu amor,\n[G]Nem mais bonito...";

let ctx=null, vsChain=null, pbChain=null;

function ensureCtx(){
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
}

function makeSimpleChain(audioEl){
  ensureCtx();
  try{
    const src=ctx.createMediaElementSource(audioEl);
    const bass=ctx.createBiquadFilter(); bass.type='lowshelf'; bass.frequency.value=250;
    const treb=ctx.createBiquadFilter(); treb.type='highshelf'; treb.frequency.value=3500;
    const gain=ctx.createGain(); gain.gain.value=1;
    src.connect(bass); bass.connect(treb); treb.connect(gain); gain.connect(ctx.destination);
    return {src,bass,treb,gain,connected:true};
  }catch(e){ console.log('WebAudio falhou, usando audio nativo',e); return null; }
}

function loadVS(input){
  const f=input.files[0]; if(!f) return;
  const a=document.getElementById('aVS');
  a.src=URL.createObjectURL(f);
  a.load();
  document.getElementById('fVSName').innerText='📁 '+f.name;
  a.oncanplay=()=>{ 
    if(!vsChain){ vsChain=makeSimpleChain(a); }
    a.play().catch(()=>{});
  };
}
function loadPB(input){
  const f=input.files[0]; if(!f) return;
  const a=document.getElementById('aPB');
  a.src=URL.createObjectURL(f);
  a.load();
  document.getElementById('fPBName').innerText='📁 '+f.name;
  a.oncanplay=()=>{ 
    if(!pbChain){ pbChain=makeSimpleChain(a); }
    a.play().catch(()=>{});
  };
}
function changeBPM(type,val){
  const a=document.getElementById(type==='vs'?'aVS':'aPB');
  a.playbackRate=val/100;
  document.getElementById(type==='vs'?'vsB':'pbB').innerText=val+'%';
}
function changeVol(type,val){
  const a=document.getElementById(type==='vs'?'aVS':'aPB');
  a.volume=val/100;
  document.getElementById(type==='vs'?'vsV':'pbV').innerText=val+'%';
}
function changeEQ(type,band,val){
  ensureCtx();
  const chain=type==='vs'?vsChain:pbChain;
  if(!chain) return;
  if(band==='bass') chain.bass.gain.value=parseInt(val);
  else chain.treb.gain.value=parseInt(val);
  document.getElementById((type==='vs'?'vs':'pb')+(band==='bass'?'G':'A')).innerText=val+'dB';
}
function parseCifra(text){
  const box=document.getElementById('cifraBox'); box.innerHTML='';
  const lines=text.split('\n');
  lines.forEach(rawLine=>{
    if(!rawLine.trim()){ box.innerHTML+='<div style="height:8px"></div>'; return; }
    const lineDiv=document.createElement('div'); lineDiv.className='cifra-line';
    const allMatches=[...rawLine.matchAll(/\[([^\]]+)\]/g)];
    if(allMatches.length===0){
      const pair=document.createElement('span'); pair.className='pair';
      const c=document.createElement('span'); c.className='chord'; c.innerHTML='&nbsp;';
      const l=document.createElement('span'); l.className='lyric'; l.textContent=rawLine;
      pair.appendChild(c); pair.appendChild(l); lineDiv.appendChild(pair);
    } else {
      allMatches.forEach((m,i)=>{
        const nextStart=i+1<allMatches.length?allMatches[i+1].index:rawLine.length;
        const lyricText=rawLine.substring(m.index+m[0].length, nextStart);
        const pair=document.createElement('span'); pair.className='pair';
        const cs=document.createElement('span'); cs.className='chord'; cs.textContent=m[1];
        const ls=document.createElement('span'); ls.className='lyric'; ls.textContent=lyricText||' ';
        pair.appendChild(cs); pair.appendChild(ls); lineDiv.appendChild(pair);
        if(i===0 && m.index>0){
          const before=document.createElement('span'); before.className='pair';
          const cc=document.createElement('span'); cc.className='chord'; cc.innerHTML='&nbsp;';
          const ll=document.createElement('span'); ll.className='lyric'; ll.textContent=rawLine.substring(0,m.index);
          before.appendChild(cc); before.appendChild(ll);
          lineDiv.insertBefore(before, lineDiv.firstChild);
        }
      });
    }
    box.appendChild(lineDiv);
  });
}
function toggleMenu(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
function toggleControles(){ const c=document.getElementById('controles'); const a=document.getElementById('arrow'); if(c.classList.contains('open')){ c.classList.remove('open'); c.classList.add('closed'); a.innerText='▶'; } else { c.classList.remove('closed'); c.classList.add('open'); a.innerText='▼'; } }
function chgSz(t,d){ if(t==='c'){ cs=Math.max(10,Math.min(32,cs+d)); document.documentElement.style.setProperty('--chord-size',cs+'px'); document.getElementById('cSz').innerText=cs+'px'; } else { ls=Math.max(12,Math.min(40,ls+d)); document.documentElement.style.setProperty('--lyric-size',ls+'px'); document.getElementById('lSz').innerText=ls+'px'; } }
const tons=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; function chgTom(d){ let i=tons.indexOf(document.getElementById('tom').innerText); i=(i+d+12)%12; document.getElementById('tom').innerText=tons[i]; } function chgCapo(d){ let v=parseInt(document.getElementById('capo').innerText)+d; if(v<0)v=0; if(v>12)v=12; document.getElementById('capo').innerText=v; }
function setSpeed(s){ speed=s; document.querySelectorAll('.speed').forEach(e=>e.classList.remove('active')); document.getElementById('sp'+s).classList.add('active'); document.getElementById('speedLabel').innerText=labels[s]; if(isScrolling){ clearInterval(scrollId); startScroll(); } }
function toggleScroll(){ isScrolling?stopScroll():startScroll(); }
function startScroll(){ isScrolling=true; document.getElementById('playScroll').innerText='⏸ PAUSE'; const b=document.getElementById('cifraBox'); scrollId=setInterval(()=>{ b.scrollTop+=speeds[speed]; if(b.scrollTop+b.clientHeight>=b.scrollHeight-2) stopScroll(); },40); }
function stopScroll(){ isScrolling=false; document.getElementById('playScroll').innerText='▶ PLAY'; clearInterval(scrollId); }
function toggleFullscreen(){ 
  document.body.classList.toggle('fullscreen-cifra'); 
  if(document.body.classList.contains('fullscreen-cifra')){
    setTimeout(()=>{ document.getElementById('hint').classList.add('show'); setTimeout(()=>document.getElementById('hint').classList.remove('show'),2500); },400);
    hideTools();
  } else { hideTools(); }
}
function handleTap(){ if(!document.body.classList.contains('fullscreen-cifra')) return; toolsVisible?hideTools():showTools(); }
function showTools(){ document.getElementById('floatTools').classList.add('show'); toolsVisible=true; setTimeout(hideTools,4000); }
function hideTools(){ document.getElementById('floatTools').classList.remove('show'); toolsVisible=false; }
function loadCifra(i){ const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>parseCifra(e.target.result); r.readAsText(f); }

document.documentElement.style.setProperty('--chord-size','15px'); document.documentElement.style.setProperty('--lyric-size','17px');
document.getElementById('aVS').volume=0.8; document.getElementById('aPB').volume=0.8;
parseCifra(originalCifra);

// Libera audio no primeiro toque no celular
document.body.addEventListener('click',()=>{ try{ ensureCtx(); }catch(e){} },{once:true});
document.getElementById('aVS').addEventListener('play',()=>{ try{ ensureCtx(); if(!vsChain) vsChain=makeSimpleChain(document.getElementById('aVS')); }catch(e){} });
document.getElementById('aPB').addEventListener('play',()=>{ try{ ensureCtx(); if(!pbChain) pbChain=makeSimpleChain(document.getElementById('aPB')); }catch(e){} });
</script>
</body>
</html>
