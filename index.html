<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHOWTIME v8.0 FINAL EFICIENTE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} html,body{overflow-x:hidden!important;width:100%;height:100%}
:root{--blue-header:#3F51B5;--blue-chord:#1E3A8A;--gold:#D4B483;--border:#232323;--cifra-size:14px}
body{background:#0A0A0A;color:#fff;font-family:Inter,system-ui}
aside{width:240px;background:#161616;border-right:1px solid var(--border);padding:20px 0;position:fixed;height:100vh;z-index:100;transition:.3s}
main{margin-left:240px;padding:12px;display:grid;grid-template-columns:1fr 1fr 420px;gap:12px}
.topbar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:#161616;border:1px solid var(--border);padding:12px 16px;border-radius:12px}
.hamburger{display:none;font-size:22px;background:none;border:none;color:var(--gold);cursor:pointer}
.card{background:#161616;border:1px solid var(--border);border-radius:14px;padding:14px;width:100%;overflow:hidden}
.btn{padding:8px 14px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer}
.btn.gold{background:var(--gold);color:#000}
.btn.big{width:100%;padding:12px;font-size:13px;margin-bottom:8px;display:flex;justify-content:center;gap:8px}
.file{font-size:11px;color:#6B6B6B;background:#111;padding:8px 10px;border-radius:8px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl{background:#1E1E1E;border:1px solid var(--border);border-radius:10px;padding:10px}
.ctrl label{font-size:9px;color:#6B6B6B;display:flex;justify-content:space-between;margin-bottom:6px}
.ctrl input{width:100%;accent-color:var(--gold);height:4px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.scroll-bar{display:none}
audio{width:100%;height:38px;margin-bottom:8px;border-radius:8px}

/* CIFRA CARD - IGUAL PRINT */
.cifra-card{padding:0!important;background:#fff!important;border-radius:12px!important;overflow:hidden;display:flex;flex-direction:column;height:680px}
.cifra-header-blue{background:var(--blue-header);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.cifra-header-blue .title{font-size:16px;font-weight:700;line-height:1.2}
.cifra-header-blue .artist{font-size:12px;font-weight:400;opacity:.9}
.cifra-header-blue .icons{display:flex;gap:12px;font-size:18px}
.cifra-box{flex:1;background:#fff;padding:16px 16px 80px 16px;overflow-y:auto;overflow-x:hidden}
.linha-cifra{font-family:'Courier New', Courier, monospace;font-size:var(--cifra-size);white-space:pre-wrap;word-break:break-word;width:100%;line-height:1.35;margin:0;padding:0}
.linha-acorde{color:var(--blue-chord);font-weight:800}
.linha-letra{color:#000;font-weight:600}
.linha-tom{color:#000;font-weight:700}
.linha-secao{color:#000;font-weight:700;margin-top:20px;margin-bottom:8px}
.linha-vazia{height:14px}

/* BARRA FIXA EMBAIXO - IGUAL SEU PRINT CIRCULADO */
.bottom-bar{position:sticky;bottom:0;left:0;right:0;background:#5A6B7D;display:flex;align-items:center;justify-content:space-around;padding:0;height:48px;border-top:1px solid #4a5a6b;z-index:20}
.bottom-bar button{flex:1;height:100%;background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.bottom-bar button.active{background:var(--blue-header);color:#fff}
.bottom-bar button:active{background:#3f4f60}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;align-items:center;justify-content:center;padding:12px}
.modal-overlay.open{display:flex}
.modal{background:#1A1A1A;border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:#161616}
.modal-head b{color:var(--gold);font-size:13px;letter-spacing:1px}
.modal-body{padding:14px 16px;flex:1;overflow-y:auto}
.modal-body label{font-size:10px;color:#6B6B6B;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;margin-top:12px;display:block}
.modal-body label:first-child{margin-top:0}
.input-field{width:100%;background:#0E0E0E;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;outline:none}
.input-field:focus{border-color:var(--gold)}
.modal-body textarea{width:100%;height:260px;background:#0E0E0E;border:1px solid var(--border);border-radius:12px;padding:14px;color:#E8E8E8;font-family:monospace;font-size:13px;line-height:1.5;resize:none;outline:none}
.modal-foot{padding:14px 16px;display:flex;gap:10px;border-top:1px solid var(--border);background:#161616}
.modal-foot .btn{flex:1;padding:12px;font-size:12px}
.collapsible.open{max-height:900px;overflow:hidden;transition:.35s}
.collapsible.closed{max-height:0;overflow:hidden;transition:.35s}
.arrow{cursor:pointer;color:var(--gold)}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;background:#111;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper .val{min-width:56px;text-align:center;font-weight:800}
.stepper .val.gold{background:var(--gold);color:#000;padding:6px 14px;border-radius:20px;font-size:13px}
@media(max-width:900px){aside{transform:translateX(-100%)} aside.open{transform:translateX(0)} main{margin-left:0;grid-template-columns:1fr!important;gap:10px;padding:10px;width:100vw} .hamburger{display:block} .overlay.open{display:block} .cifra-card{height:75vh}}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<aside id="sidebar"><div style="padding:0 20px 20px;color:var(--gold);font-weight:900;letter-spacing:2px;border-bottom:1px solid var(--border)">SHOWTIME PRO</div></aside>
<main>
<div class="topbar"><button class="hamburger" onclick="toggleMenu()">☰</button><div><b style="color:var(--gold)">PALCO AO VIVO</b></div><div>🔔</div></div>

<div class="card player-card">
<button class="btn big gold" onclick="fVS.click()">🔍 Buscar VS</button>
<input type="file" id="fVS" hidden accept=".mp3,.wav,.m4a" onchange="loadVS(this)">
<div class="file" id="fVSName">📁 Nenhum VS</div>
<audio id="aVS" controls playsinline preload="metadata" crossorigin="anonymous"></audio>
<div class="controls">
<div class="ctrl"><label><span>BPM</span><b id="vsB">100%</b></label><input type="range" id="vsBpm" min="50" max="200" value="100" oninput="updateRate('vs')"></div>
<div class="ctrl"><label><span>VOLUME</span><b id="vsV">80%</b></label><input type="range" id="vsVol" min="0" max="100" value="80" oninput="changeVol('vs',this.value)"></div>
</div>
</div>

<div class="card player-card">
<button class="btn big" onclick="fPB.click()">🔍 Buscar Playback</button>
<input type="file" id="fPB" hidden accept=".mp3,.wav,.m4a" onchange="loadPB(this)">
<div class="file" id="fPBName">📁 Nenhum Playback</div>
<audio id="aPB" controls playsinline preload="metadata" crossorigin="anonymous"></audio>
<div class="controls">
<div class="ctrl"><label><span>BPM</span><b id="pbB">100%</b></label><input type="range" id="pbBpm" min="50" max="200" value="100" oninput="updateRate('pb')"></div>
<div class="ctrl"><label><span>VOLUME</span><b id="pbV">80%</b></label><input type="range" id="pbVol" min="0" max="100" value="80" oninput="changeVol('pb',this.value)"></div>
</div>
</div>

<div class="card cifra-card">
<div class="cifra-header-blue">
<div>
<div class="title" id="headerTitle">Primeiros Erros</div>
<div class="artist" id="headerArtist">Capital Inicial</div>
</div>
<div class="icons"><span>❓</span><span>⚙️</span><span>⋮</span></div>
</div>
<div class="cifra-box" id="cifraBox"></div>
<div class="bottom-bar" id="bottomBar">
<button id="btnPlay" class="active" onclick="toggleScroll()" title="Auto-scroll">▶</button>
<button onclick="downloadCifra()" title="Baixar">⬇</button>
<button onclick="chgSize(1)" title="Aumentar fonte">＋</button>
<button onclick="chgSize(-1)" title="Diminuir fonte">－</button>
<button onclick="openCifraModal()" title="Editar">✎</button>
<button onclick="chgTom(1)" title="Tom">♫</button>
</div>
</div>
</main>

<div class="modal-overlay" id="cifraModal" onclick="if(event.target===this)closeCifraModal()">
<div class="modal">
<div class="modal-head"><b>✍️ COLAR / ESCREVER CIFRA</b><button class="btn small" onclick="closeCifraModal()">✕</button></div>
<div class="modal-body">
<label>🎵 Nome da música *</label>
<input type="text" id="songTitle" class="input-field" placeholder="Ex: Primeiros Erros">
<label>🎤 Nome do artista *</label>
<input type="text" id="artistName" class="input-field" placeholder="Ex: Capital Inicial">
<label>🎼 Cifra / Letra</label>
<textarea id="cifraInput" placeholder="Cole exatamente igual Cifra Club..."></textarea>
</div>
<div class="modal-foot">
<button class="btn" onclick="closeCifraModal()">Cancelar</button>
<button class="btn gold" onclick="saveCifra()">💾 SALVAR</button>
</div>
</div>
</div>

<script>
let cifraSize=14,scrollId=null,speed=1,isScrolling=false;
const speeds=[0,0.25,0.7,1.6,3.0];
let currentSong={title:'Primeiros Erros', artist:'Capital Inicial', tom:'D', cifra:`tom: D
[Intro] D5  D  E/B
        D5  D  E/B
        D9  A11/C#  G/B
        D9  A11/C#  G/B

[Primeira Parte]

D5         D7M(9)              D5
     Meu caminho é cada manhã
               D7M(9)                      Bm7(11)
     Não procure saber onde estou
               Bm7(9/11)                     Bm7(11)
Meu destino não é de ninguém
                       A7(4)                         D5
E eu não deixo os meus passos no chão
               D7M(9)                      D5
Se você não entende não vê
               D7M(9)                      Bm7(11)
Se não me vê não entende
               Bm7(9/11)                     Bm7(11)
Não procure saber onde estou
               Bm7(9/11)               G7M
Se o meu jeito te surpreende

[Segunda Parte]

                 G4+(6)                  G7M
Se o meu corpo virasse sol
                 G4+(6)                  Em7(9)
Se a minha mente virasse sol
                 Em7(13)     Em7(9)
Mas só chove, chove
         Em7(13)
Chove, chove

( D9  A11/C#  G/B )
( D9  A11/C#  G/B )`};
let ctx=null; let vs={chain:null}; let pb={chain:null};

function ensureCtx(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
function createChain(audioEl){
  const c=ensureCtx();
  try{
    const src=c.createMediaElementSource(audioEl);
    const bass=c.createBiquadFilter(); bass.type='lowshelf'; bass.frequency.value=250; bass.gain.value=0;
    const treble=c.createBiquadFilter(); treble.type='highshelf'; treble.frequency.value=3500; treble.gain.value=0;
    const dry=c.createGain(); dry.gain.value=1; const wet=c.createGain(); wet.gain.value=0;
    const convolver=c.createConvolver();
    const rate=c.sampleRate, len=rate*1.2, buf=c.createBuffer(2,len,rate);
    for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2)*0.35; } }
    convolver.buffer=buf; const master=c.createGain(); master.gain.value=1;
    src.connect(bass); bass.connect(treble); treble.connect(dry); treble.connect(convolver); convolver.connect(wet); dry.connect(master); wet.connect(master); master.connect(c.destination);
    return {src,bass,treble,dry,wet,convolver,master, ok:true};
  }catch(e){ return {ok:false}; }
}
function loadVS(input){ const f=input.files[0]; if(!f) return; const a=document.getElementById('aVS'); a.src=URL.createObjectURL(f); a.load(); document.getElementById('fVSName').innerText='📁 '+f.name; a.oncanplay=()=>{ if(!vs.chain) vs.chain=createChain(a); a.play().catch(()=>{}); }; }
function loadPB(input){ const f=input.files[0]; if(!f) return; const a=document.getElementById('aPB'); a.src=URL.createObjectURL(f); a.load(); document.getElementById('fPBName').innerText='📁 '+f.name; a.oncanplay=()=>{ if(!pb.chain) pb.chain=createChain(a); a.play().catch(()=>{}); }; }
function updateRate(type){
  const isVS=type==='vs'; const bpmEl=document.getElementById(isVS?'vsBpm':'pbBpm'); const a=document.getElementById(isVS?'aVS':'aPB'); const bpm=parseInt(bpmEl.value);
  a.playbackRate=bpm/100; document.getElementById(isVS?'vsB':'pbB').innerText=bpm+'%';
}
function changeVol(type,val){ document.getElementById(type==='vs'?'aVS':'aPB').volume=val/100; document.getElementById(type==='vs'?'vsV':'pbV').innerText=val+'%'; }

function renderCifra(text){
  const box=document.getElementById('cifraBox'); box.innerHTML='';
  const lines=text.split('\n');
  lines.forEach(raw=>{
    if(!raw.trim()){ const d=document.createElement('div'); d.className='linha-cifra linha-vazia'; d.textContent=''; box.appendChild(d); return; }
    const trimmed=raw.trim();
    if(/^tom:\s*[A-G]/i.test(trimmed)){
      const d=document.createElement('div'); d.className='linha-cifra linha-tom'; d.textContent=raw; box.appendChild(d); return;
    }
    if(/^\[.*\]$/.test(trimmed)){
      const d=document.createElement('div'); d.className='linha-cifra linha-secao'; d.textContent=raw; box.appendChild(d); return;
    }
    const isChordLine=/^[A-G0-9#\/\(\)b\+M\s]+$/.test(raw.trim()) && /[A-G]/.test(raw) && !/[a-z]{4,}/.test(raw.toLowerCase().replace(/m/g,'')) || (raw.includes('D5') || raw.includes('A11') || raw.includes('E/B') || raw.includes('G/B')) && raw.trim().split(/\s+/).every(t=>/^[A-G\d]/.test(t));
    // Check mais simples: se linha tem acorde conhecido e não tem palavras longas
    const chordCheck = /^(?:\s*[A-G][#b]?(?:m|M|maj|min|M\(9\)|7M|m7|M7|11|13|9\/11|11\)|\(9\)|\(11\)|\(4\)|4\+\(6\)|7M|M|\+)?(?:\/[A-G][#b]?)?\s*)+$/.test(raw.trim()) || (/[A-G]\d/.test(raw) && raw.length<60 && !/[a-záéíóú]{5,}/i.test(raw));
    const finalIsChord = isChordLine || chordCheck || (raw.trim().split(/\s+/).length<=6 && /[A-G]/.test(raw) && !/[a-záéíóú]{6,}/i.test(raw));

    if(finalIsChord && /[A-G]/.test(raw)){
      const d=document.createElement('div'); d.className='linha-cifra linha-acorde'; d.textContent=raw; box.appendChild(d);
    } else {
      // Se linha começa com [Intro] D5 D E/B
      if(/^\[Intro\]/i.test(raw)){
        const d=document.createElement('div'); d.className='linha-cifra';
        const m=raw.match(/^(\[Intro\])\s*(.*)$/i);
        if(m){
          const sec=document.createElement('span'); sec.className='linha-secao'; sec.style.display='inline'; sec.style.margin='0'; sec.textContent=m[1]+'  ';
          const ch=document.createElement('span'); ch.className='linha-acorde'; ch.textContent=m[2];
          d.appendChild(sec); d.appendChild(ch);
        } else {
          d.textContent=raw; d.className='linha-cifra linha-secao';
        }
        box.appendChild(d);
      } else {
        const d=document.createElement('div'); d.className='linha-cifra linha-letra'; d.textContent=raw; box.appendChild(d);
      }
    }
  });
}

function openCifraModal(){
  document.getElementById('cifraModal').classList.add('open');
  document.getElementById('songTitle').value=currentSong.title||'';
  document.getElementById('artistName').value=currentSong.artist||'';
  document.getElementById('cifraInput').value=currentSong.cifra||'';
}
function closeCifraModal(){ document.getElementById('cifraModal').classList.remove('open'); }
function saveCifra(){
  const title=document.getElementById('songTitle').value.trim();
  const artist=document.getElementById('artistName').value.trim();
  const txt=document.getElementById('cifraInput').value;
  if(!title||!artist||!txt.trim()){ alert('Preencha tudo!'); return; }
  currentSong.title=title; currentSong.artist=artist; currentSong.cifra=txt;
  document.getElementById('headerTitle').innerText=title;
  document.getElementById('headerArtist').innerText=artist;
  const tomMatch=txt.match(/tom:\s*([A-G][#b]?)/i); if(tomMatch){ currentSong.tom=tomMatch[1].toUpperCase(); }
  renderCifra(txt); closeCifraModal();
}
function clearCifra(){ document.getElementById('songTitle').value=''; document.getElementById('artistName').value=''; document.getElementById('cifraInput').value=''; }
function chgSize(d){
  cifraSize=Math.max(10,Math.min(22,cifraSize+d));
  document.documentElement.style.setProperty('--cifra-size',cifraSize+'px');
}
function chgTom(d){
  const tons=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  let i=tons.indexOf(currentSong.tom); if(i===-1) i=2;
  i=(i+d+12)%12; currentSong.tom=tons[i];
}
function toggleScroll(){
  const btn=document.getElementById('btnPlay');
  if(isScrolling){ stopScroll(); btn.innerHTML='▶'; btn.classList.add('active'); }
  else { startScroll(); btn.innerHTML='⏸'; btn.classList.remove('active'); btn.style.background='#C62828'; }
}
function startScroll(){
  isScrolling=true;
  const b=document.getElementById('cifraBox');
  scrollId=setInterval(()=>{ b.scrollTop+=speeds[speed]; if(b.scrollTop+b.clientHeight>=b.scrollHeight-2) stopScroll(); },40);
}
function stopScroll(){
  isScrolling=false; clearInterval(scrollId);
  const btn=document.getElementById('btnPlay'); btn.innerHTML='▶'; btn.classList.add('active'); btn.style.background='';
}
function downloadCifra(){
  const blob=new Blob([currentSong.cifra],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=currentSong.title+'.txt'; a.click();
}
function toggleMenu(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }

document.documentElement.style.setProperty('--cifra-size','14px');
document.getElementById('aVS').volume=0.8; document.getElementById('aPB').volume=0.8;
renderCifra(currentSong.cifra);
</script>
</body>
</html>
