<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKI PRO LIVE</title>
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{margin:0;background:#f5f5f5;display:grid;place-items:center;min-height:100vh;padding:16px}
.card{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.12);border:2px solid #222}
h1{margin:0;text-align:center;font-weight:900;font-size:28px;letter-spacing:-1px}
.sub{font-size:12px;color:#666;text-align:center;margin:6px 0 18px 0}
input{width:100%;padding:14px 16px;border:1.5px solid #ddd;border-radius:12px;margin:8px 0;font-size:15px;outline:none;background:#fff}
input:focus{border-color:#7c6cff}
input.email{background:#e8f0fe}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;margin:8px 0}
.btn-entrar{background:#222;color:#fff}
.btn-criar{background:#f5f5f5;color:#000;border:1.5px solid #ddd}
.btn-rec{background:#fff3b0;color:#7a5a00;border:1.5px dashed #e6c200}
.msg{font-size:12px;text-align:center;padding:8px;border-radius:8px;display:none;margin:8px 0}
.msg.ok{display:block;background:#e8ffe8;color:#0a7a0a;border:1px solid #b6e6b6}
.msg.erro{display:block;background:#ffe3e3;color:#a00;border:1px solid #fecaca}
</style>
</head>
<body>
<div class="card">
<h1>TAKI PRO LIVE</h1>
<div class="sub" id="versao">v2.8 - ADM: takitakisom@gmail.com</div>

<div class="msg" id="msg"></div>

<input class="email" id="email" type="email" placeholder="Seu e-mail" value="takitakisom@gmail.com" autocomplete="email">
<input id="senha" type="password" placeholder="Sua senha" value="" autocomplete="current-password">

<button class="btn btn-entrar" id="btnEntrar" onclick="fazerLogin()">ENTRAR</button>
<button class="btn btn-criar" onclick="criarConta()">CRIAR CONTA GRÁTIS</button>
<button class="btn btn-rec" onclick="recuperarSenha()">🔑 ESQUECEU A SENHA? RECUPERAR</button>

<div style="font-size:10px;color:#999;text-align:center;margin-top:12px">Toque em ENTRAR. Se for seu primeiro acesso com takitakisom@gmail.com, qualquer senha com 4+ dígitos libera.</div>
</div>

<script>
// BANCO LOCAL - NUNCA MAIS TRAVA
function getUsers(){try{return JSON.parse(localStorage.getItem('taki_users')||'{}')}catch{return {}}}
function saveUsers(u){localStorage.setItem('taki_users', JSON.stringify(u))}
function showMsg(tipo, texto){
 const el=document.getElementById('msg');
 el.className='msg '+(tipo==='ok'?'ok':'erro');
 el.innerText=texto;
 el.style.display='block';
 setTimeout(()=>el.style.display='none', 4000);
}

// Inicializa ADM se não existir
(function initAdmin(){
 let users=getUsers();
 if(!users['takitakisom@gmail.com']){
  users['takitakisom@gmail.com']={senha:'taki123', nome:'ADM Taki', data: new Date().toISOString()};
  saveUsers(users);
 }
})();

function fazerLogin(){
 const email=document.getElementById('email').value.trim().toLowerCase();
 const senha=document.getElementById('senha').value.trim();
 if(!email || !senha){showMsg('erro','Digite e-mail e senha');return;}

 let users=getUsers();
 // LIBERAÇÃO ESPECIAL PRO SEU ADM - pra destravar agora
 if(email==='takitakisom@gmail.com'){
  if(senha.length>=4){
   // atualiza senha e entra
   users[email]={...users[email], senha:senha};
   saveUsers(users);
   localStorage.setItem('taki_logado', email);
   showMsg('ok','Bem-vindo ADM! Entrando...');
   setTimeout(()=>{window.location.href='agenda.html';},800);
   return;
  }
 }

 if(users[email] && users[email].senha===senha){
  localStorage.setItem('taki_logado', email);
  showMsg('ok','Login OK! Entrando...');
  setTimeout(()=>{window.location.href='agenda.html';},600);
 }else{
  showMsg('erro','E-mail ou senha incorretos. Clique em RECUPERAR se esqueceu.');
 }
}

function criarConta(){
 const email=document.getElementById('email').value.trim().toLowerCase();
 const senha=document.getElementById('senha').value.trim();
 if(!email || senha.length<4){showMsg('erro','Digite um e-mail válido e senha com no mínimo 4 dígitos');return;}
 let users=getUsers();
 if(users[email]){showMsg('erro','Este e-mail já existe. Clique em ENTRAR');return;}
 users[email]={senha:senha, nome:email.split('@')[0], data:new Date().toISOString()};
 saveUsers(users);
 localStorage.setItem('taki_logado', email);
 showMsg('ok','Conta criada! Entrando...');
 setTimeout(()=>{window.location.href='agenda.html';},800);
}

function recuperarSenha(){
 const email=document.getElementById('email').value.trim().toLowerCase();
 if(!email){showMsg('erro','Digite seu e-mail no campo acima');return;}
 let users=getUsers();
 if(!users[email]){showMsg('erro','E-mail não encontrado. Crie uma conta grátis.');return;}
 const nova=prompt('Digite uma NOVA senha (4+ dígitos) para '+email+':');
 if(nova && nova.length>=4){
  users[email].senha=nova;
  saveUsers(users);
  document.getElementById('senha').value=nova;
  showMsg('ok','Senha alterada! Agora clique em ENTRAR');
 }else if(nova){
  showMsg('erro','Senha muito curta');
 }
}

// Enter pra logar
document.getElementById('senha').addEventListener('keydown', e=>{if(e.key==='Enter')fazerLogin()});
document.getElementById('email').addEventListener('keydown', e=>{if(e.key==='Enter')fazerLogin()});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
